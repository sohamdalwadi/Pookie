name: Pookie Dev Build & Release

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev-apk:
    name: Build & Publish Dev Testing APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK for Testing
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Dev Artifacts
        id: prepare_apk
        run: |
          mkdir -p release-apks
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          
          # Determine version starting from last git tag (or 0.0.0 if no tag)
          LAST_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            BASE_VERSION="0.0.0"
            COMMITS=$(git rev-list --count HEAD)
          else
            BASE_VERSION="${LAST_TAG#v}"
            COMMITS=$(git rev-list --count "${LAST_TAG}..HEAD")
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEW_PATCH=$((PATCH + COMMITS))
          CALCULATED_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Calculated version: $CALCULATED_VERSION"
          echo "version=$CALCULATED_VERSION" >> $GITHUB_OUTPUT
          
          # Copy APK with rolling and versioned names
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/Pookie-dev-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/Pookie-v${CALCULATED_VERSION}.apk
          
          echo "APK files prepared:"
          ls -la release-apks/

      - name: Clean Existing APKs from Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-latest"
          echo "Purging old APK assets from $TAG so only the newest APK is kept..."
          OLD_ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          for asset in $OLD_ASSETS; do
            if [[ "$asset" == *.apk ]]; then
              echo "Deleting old asset: $asset"
              gh release delete-asset "$TAG" "$asset" -y || true
            fi
          done

      - name: Upload Dev APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pookie-dev-apk
          path: release-apks/
          retention-days: 14

      - name: Publish / Update Dev Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Pookie Dev Testing Build v${{ steps.prepare_apk.outputs.version }} (${{ steps.prepare_apk.outputs.short_sha }})"
          prerelease: true
          make_latest: true
          body: |
            ### 🧪 Pookie Development Testing Build v${{ steps.prepare_apk.outputs.version }}
            
            This build was automatically generated from the **`develop`** branch for QA and internal testing.
            
            * **Version:** `v${{ steps.prepare_apk.outputs.version }}`
            * **Commit:** `${{ github.sha }}` (${{ steps.prepare_apk.outputs.short_sha }})
            * **Triggered by:** @${{ github.actor }}
            * **Branch:** `develop`
            * **Build Number:** `${{ github.run_number }}`
            
            ---
            
            #### 📲 Download & Install
            1. Download [`Pookie-dev-latest.apk`](https://github.com/sohamdalwadi/Pookie/releases/download/dev-latest/Pookie-dev-latest.apk) on your Android device.
            2. Open the file and allow installation from browser/files.
            3. Enter your Google Sheets Backend Deployment ID in the app setup screen to start testing!
          files: |
            release-apks/Pookie-dev-latest.apk
            release-apks/Pookie-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
