name: Pookie CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-specs:
    name: Validate Specs & Backend Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify JSON Template Validity
        run: |
          python3 -c "import json; json.load(open('app/config.template.json'))"
          python3 -c "import json; json.load(open('backend/.clasp.json.example'))"
          echo "Configuration templates are valid JSON."

      - name: Verify Backend JavaScript Syntax
        run: |
          node --check backend/src/Code.js
          echo "backend/src/Code.js passed syntax verification."

      - name: Verify Web Build
        working-directory: web
        run: |
          npm ci
          npm run build
          echo "Pookie web bundle compiled successfully."


  build-and-test:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    needs: validate-specs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin Code
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
