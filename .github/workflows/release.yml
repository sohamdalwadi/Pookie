name: Pookie Automated Tag Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0, v0.1.0-alpha

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Package Application
        id: build_step
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
            echo "has_apk=true" >> $GITHUB_OUTPUT
          else
            echo "has_apk=false" >> $GITHUB_OUTPUT
            echo "Creating specification and release package bundle..."
            zip -r pookie-release-docs.zip docs app/config.template.json backend/README.md
          fi

      - name: Generate Changelog and Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            pookie-release-docs.zip
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
