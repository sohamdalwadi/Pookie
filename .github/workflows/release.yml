name: Pookie Production Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0, v1.1.0
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Production Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compile and Package APK
        id: build_step
        run: |
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p release-apks
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "main" ]; then
            RELEASE_TAG="${{ github.event.inputs.version_tag }}"
          fi
          
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/Pookie-${RELEASE_TAG}.apk
          echo "tag_name=$RELEASE_TAG" >> $GITHUB_OUTPUT
          ls -la release-apks/

      - name: Upload Production APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pookie-production-apk
          path: release-apks/
          retention-days: 30

      - name: Generate Changelog and Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_step.outputs.tag_name }}
          name: "Pookie Official Release ${{ steps.build_step.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-apks/Pookie-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
