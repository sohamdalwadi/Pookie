plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def rawDeploymentId = localProperties.getProperty("POOKIE_DEMO_DEPLOYMENT_ID") ?:
        localProperties.getProperty("demo.deployment.id") ?: ""

byte mask = (byte) 0x5C
byte[] rawBytes = rawDeploymentId.getBytes("UTF-8")
StringBuilder hexBuilder = new StringBuilder()
if (rawBytes.length > 0) {
    for (int i = 0; i < rawBytes.length; i++) {
        byte enc = (byte) (rawBytes[i] ^ mask)
        hexBuilder.append(String.format("%02X", enc & 0xFF))
    }
}
def encryptedDemoKeyHex = hexBuilder.toString()

def computeVersionInfo() {
    def baseVersion = "0.0.0"
    def commitCount = 0
    try {
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def gitCmd = isWindows ? ["cmd", "/c", "git"] : ["git"]

        def tagStdout = new ByteArrayOutputStream()
        exec {
            commandLine(*gitCmd, 'describe', '--tags', '--match', 'v[0-9]*', '--abbrev=0')
            standardOutput = tagStdout
            ignoreExitValue = true
        }
        def latestTag = tagStdout.toString().trim()
        if (latestTag.startsWith("v")) {
            latestTag = latestTag.substring(1)
        }

        if (!latestTag.isEmpty()) {
            baseVersion = latestTag
            def countStdout = new ByteArrayOutputStream()
            exec {
                commandLine(*gitCmd, 'rev-list', '--count', "v${latestTag}..HEAD")
                standardOutput = countStdout
                ignoreExitValue = true
            }
            def countStr = countStdout.toString().trim()
            commitCount = countStr.isInteger() ? countStr.toInteger() : 0
        } else {
            def totalStdout = new ByteArrayOutputStream()
            exec {
                commandLine(*gitCmd, 'rev-list', '--count', 'HEAD')
                standardOutput = totalStdout
                ignoreExitValue = true
            }
            def countStr = totalStdout.toString().trim()
            commitCount = countStr.isInteger() ? countStr.toInteger() : 1
        }
    } catch (Exception ignored) {
        commitCount = 1
    }

    def parts = baseVersion.split("\\.")
    def major = parts.length > 0 && parts[0].isInteger() ? parts[0].toInteger() : 0
    def minor = parts.length > 1 && parts[1].isInteger() ? parts[1].toInteger() : 0
    def patch = parts.length > 2 && parts[2].isInteger() ? parts[2].toInteger() : 0

    def newPatch = patch + commitCount
    def versionName = "${major}.${minor}.${newPatch}"
    def versionCode = Math.max(1, (major * 10000) + (minor * 100) + newPatch)

    return [versionCode: versionCode, versionName: versionName]
}

def versionInfo = computeVersionInfo()

def gitBranch = System.getenv("GITHUB_REF_NAME") ?: ""
if (gitBranch.isEmpty()) {
    try {
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def gitCmd = isWindows ? ["cmd", "/c", "git"] : ["git"]
        def branchStdout = new ByteArrayOutputStream()
        exec {
            commandLine(*gitCmd, 'rev-parse', '--abbrev-ref', 'HEAD')
            standardOutput = branchStdout
            ignoreExitValue = true
        }
        gitBranch = branchStdout.toString().trim()
    } catch (Exception ignored) {
        gitBranch = "develop"
    }
}

def isProduction = gitBranch == "main" || gitBranch.startsWith("v")
def otaChannel = isProduction ? "PRODUCTION" : "DEVELOP"
def otaEndpoint = isProduction ?
    "https://api.github.com/repos/sohamdalwadi/Pookie/releases/latest" :
    "https://api.github.com/repos/sohamdalwadi/Pookie/releases/tags/dev-latest"

android {
    namespace 'com.pookie.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.pookie.game"
        minSdk 24
        targetSdk 34
        versionCode versionInfo.versionCode
        versionName versionInfo.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "ENCRYPTED_DEMO_KEY_HEX", "\"${encryptedDemoKeyHex}\""
        buildConfigField "String", "OTA_CHANNEL", "\"${otaChannel}\""
        buildConfigField "String", "OTA_UPDATE_URL", "\"${otaEndpoint}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Architecture Components & Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Networking & Serialization
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
